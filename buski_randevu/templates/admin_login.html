<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUSKİ Admin Girişi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .top-navbar {
            background: rgba(11, 19, 41, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 30px;
        }

        /* Beyaz kutu kaldırıldı ve logo boyutu ana sayfayla aynı yapıldı */
        .top-logo-box {
            background: transparent !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .top-logo-box img {
            height: 58px;
            width: auto;
            object-fit: contain;
        }

        .top-navbar h5 {
            font-size: 1.3rem !important;
        }
        .top-navbar small.text-muted {
            color: #ffffff !important;
            opacity: 1 !important;
            font-weight: 500;
            font-size: 0.9rem !important;
        }

        .nav-link-custom {
            color: #cbd5e1;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-link-custom:hover, .nav-link-custom.active {
            color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.1);
        }

        .glass-card {
            background: rgba(18, 28, 58, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 35px;
        }

        .form-control {
            background-color: rgba(11, 19, 41, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background-color: rgba(11, 19, 41, 0.95);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .btn-info {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <!-- 1. ÜST NAVBAR -->
    <nav class="top-navbar d-flex align-items-center justify-content-between sticky-top">
        <div class="d-flex align-items-center gap-3">
            <div class="top-logo-box">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="BUSKİ Logosu">
            </div>
            <div>
                <h5 class="fw-bold mb-0 text-white">BUSKİ</h5>
                <small class="text-muted d-block">Yönetim Paneli</small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2">
            <a href="/" class="nav-link-custom"><i class="fa-solid fa-house me-1"></i> Ana Sayfa / Randevu Al</a>
        </div>
    </nav>

    <!-- 2. GİRİŞ FORMU ALANI -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ 'danger' if category == 'danger' else ('warning' if category == 'warning' else 'success') }} alert-dismissible fade show glass-card mb-4" style="color: #ffffff !important;">
                        {{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div class="glass-card shadow-lg text-center">
                    <div class="mb-3 text-info fs-2">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Admin Girişi</h3>
                    <p class="text-light small mb-4">Sisteme erişmek için yetkili bilgilerinizi giriniz.</p>

                    <form action="/admin-login" method="POST">
                        <div class="mb-3 text-start">
                            <label class="form-label text-light fw-semibold">Kullanıcı Adı</label>
                            <input type="text" class="form-control" name="username" placeholder="Kullanıcı adınızı girin" required>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-light fw-semibold">Şifre</label>
                            <input type="password" class="form-control" name="password" placeholder="Şifrenizi girin" required>
                        </div>

                        <button type="submit" class="btn btn-info w-100 py-3 fw-bold text-dark"><i class="fa-solid fa-right-to-bracket me-2"></i>Giriş Yap</button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
